version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5108:5108"
    depends_on:
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=...   
      - Redis__ConnectionString=redis:6379
    networks:
      - forum-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - forum-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - forum-network

networks:
  forum-network:
    driver: bridge